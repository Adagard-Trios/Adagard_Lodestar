# SonarQube analysis for the Waypoint Lodestar monorepo (PLATFORM.md §6).
# Local server: docker compose --profile qa up -d sonarqube   (http://localhost:9000)
# Scan:         docker run --rm --network host -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN=... \
#                 -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
# CI:           SonarQube Cloud from CircleCI (.circleci/config.yml job `sonar`), waiting for the gate.
# Gate:         tools/qa/sonar-gate.sh creates "Lodestar" (docs/QA.md): no new bugs or vulnerabilities, no new
#               blocker/critical issues, coverage on new code >= 80 %, duplication on new code < 3 %.

sonar.projectKey=waypoint-lodestar
sonar.projectName=Waypoint Lodestar
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# ---------------------------------------------------------------------------------------------------
# Sources and tests
# ---------------------------------------------------------------------------------------------------
# frontend: Next.js desk faces · mobile: Expo field app · backend: NestJS services + libs (TS)
# backend/apps/agent: planning agent (Python, FastAPI + LangGraph)
sonar.sources=frontend,mobile/src,backend/apps,backend/libs,backend/prisma
sonar.tests=frontend/__tests__,frontend/cypress,mobile/src,backend,tests/e2e,tests/visual
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.cy.ts,\
  **/__tests__/**,\
  backend/apps/agent/tests/**/*.py,\
  tests/e2e/**/*.ts,  tests/visual/**/*.ts
# keep tests out of the source set (they are analysed as tests above)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.expo/**,\
  **/web-build/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/migrations/**,\
  backend/prisma/migrations/**,\
  frontend/screens/**,\
  frontend/app/store/sm-*/page.tsx,\
  frontend/app/plan/dsp-*/page.tsx,\
  frontend/app/admin/adm-*/page.tsx,\
  frontend/app/store/page.tsx,\
  frontend/app/plan/page.tsx,\
  frontend/app/admin/page.tsx,\
  frontend/app/styles/boards/**,\
  frontend/app/prototypes/**,\
  mobile/src/screens/**,\
  tools/screengen/out/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.cy.ts,\
  **/__tests__/**,\
  frontend/cypress/**,\
  backend/apps/agent/tests/**,\
  **/*.d.ts,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/jest.setup.ts
sonar.test.exclusions=Designing/**,mobile/src/screens/**,**/node_modules/**,tests/visual/baselines/**,tests/visual/report/**,**/.next/**,**/dist/**,tests/e2e/reports/**,tests/e2e/test-results/**

# Generated screens are never analysed for duplication either (they are design output, not code).
sonar.cpd.exclusions=frontend/screens/**,mobile/src/screens/**,frontend/app/**/page.tsx,**/*.css

# Coverage is only measured on hand-written code; the generated screens are excluded above.
sonar.coverage.exclusions=\
  frontend/cypress/**,\
  tests/e2e/**,\
  **/main.ts,\
  **/*.module.ts,\
  backend/prisma/**,\
  mobile/src/app/**

# ---------------------------------------------------------------------------------------------------
# TypeScript / JavaScript (frontend, mobile, backend)
# ---------------------------------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,mobile/coverage/lcov.info,backend/coverage/lcov.info
sonar.typescript.tsconfigPaths=frontend/tsconfig.json,mobile/tsconfig.json,backend/tsconfig.json
sonar.junit.reportPaths=frontend/reports/junit,backend/reports/junit

# ---------------------------------------------------------------------------------------------------
# Python (planning agent)
# ---------------------------------------------------------------------------------------------------
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/apps/agent/coverage.xml
sonar.python.xunit.reportPath=backend/apps/agent/reports/pytest.xml

# ---------------------------------------------------------------------------------------------------
# Quality gate: the scanner waits for the gate in CI (Jenkins also calls waitForQualityGate).
# ---------------------------------------------------------------------------------------------------
# Local scans don't block; CI passes -Dsonar.qualitygate.wait=true.
sonar.qualitygate.wait=false
