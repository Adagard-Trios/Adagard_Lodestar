# CORS for the OData API. $cors_* are empty unless the Origin is allow-listed
# (see the maps in nginx.conf); nginx does not emit add_header with an empty value.
# Always include together with security-headers.conf.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Max-Age;
add_header Vary "Origin" always;
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Methods $cors_methods always;
add_header Access-Control-Allow-Headers $cors_headers always;
add_header Access-Control-Expose-Headers $cors_expose always;
add_header Access-Control-Max-Age $cors_max_age always;
