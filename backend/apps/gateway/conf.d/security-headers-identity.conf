# Keycloak (/auth/) variant: keycloak-js loads the login-status and silent
# check-sso iframes from this same origin, so framing is allowed for 'self'
# only. Keycloak's own framing/CSP headers are hidden so a single policy applies.
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
# No COOP isolation on the login pages: the field app (/field/) signs in through a popup
# that must keep its window.opener to hand the code back. same-origin here would sever that link.
add_header Cross-Origin-Opener-Policy "unsafe-none" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' http://localhost:3000 lodestar: exp:; frame-src 'self'; frame-ancestors 'self'" always;
add_header X-Request-Id $request_id always;
proxy_hide_header X-Powered-By;
