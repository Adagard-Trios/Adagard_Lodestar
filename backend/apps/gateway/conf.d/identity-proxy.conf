# Proxy to Keycloak, keeping the /auth prefix (KC_HTTP_RELATIVE_PATH=/auth).
set $identity_upstream identity:8080;
proxy_pass http://$identity_upstream;
# Keycloak sends large Set-Cookie / Location headers.
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
include /etc/nginx/conf.d/security-headers-identity.conf;
