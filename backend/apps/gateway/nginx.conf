worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Upstream definitions
  upstream auth        { server auth:3001; }
  upstream orders      { server orders:3002; }
  upstream planning    { server planning:3003; }
  upstream fleet       { server fleet:3004; }
  upstream outlets     { server outlets:3005; }
  upstream trips       { server trips:3006; }
  upstream sync        { server sync:3007; }
  upstream notifications { server notifications:3008; }

  server {
    listen 80;
    server_name _;

    # CORS headers for all responses
    add_header 'Access-Control-Allow-Origin'  '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    location = /health {
      return 200 '{"status":"ok","service":"lodestar-gateway"}';
      add_header Content-Type application/json;
    }

    # ── Auth  /api/auth/** ─────────────────────────────────────
    location /api/auth/ {
      proxy_pass         http://auth/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Orders  /api/orders/** ────────────────────────────────
    location /api/orders/ {
      proxy_pass         http://orders/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Planning  /api/planning/** ────────────────────────────
    location /api/planning/ {
      proxy_pass         http://planning/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Fleet  /api/fleet/** ──────────────────────────────────
    location /api/fleet/ {
      proxy_pass         http://fleet/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Outlets  /api/outlets/** ──────────────────────────────
    location /api/outlets/ {
      proxy_pass         http://outlets/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Trips  /api/trips/** ──────────────────────────────────
    location /api/trips/ {
      proxy_pass         http://trips/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Offline Sync  /api/sync/** ────────────────────────────
    location /api/sync/ {
      proxy_pass         http://sync/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Notifications (WebSocket)  /api/notifications/** ──────
    location /api/notifications/ {
      proxy_pass         http://notifications/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      # WebSocket upgrade
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_read_timeout 86400;
    }

    # ── WebSocket  /ws/** ──────────────────────────────────────
    location /ws/ {
      proxy_pass         http://notifications/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 86400;
    }

    # OPTIONS preflight
    if ($request_method = OPTIONS) {
      return 204;
    }
  }
}
