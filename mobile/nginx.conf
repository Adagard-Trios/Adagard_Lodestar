# Serves the static Expo web export. Every screen is pre-rendered at /s/<key>.html.
# The browser build calls the API on its own origin: /odata/ and /ws/ are passed to the gateway, so no
# CORS preflight is needed for the device and idempotency headers. The gateway and every service still
# verify the bearer token (this proxy makes no access decision). Sign-in goes to Keycloak directly
# (https://localhost:8443/auth, CORS allowed for this origin on the lodestar-field client).
map $http_upgrade $lodestar_connection {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  root /usr/share/nginx/html;

  # Docker's embedded DNS; a variable upstream resolves per request, so this server starts without the gateway.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway https://gateway:8443;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # OData API (same origin for the browser build)
  location /odata/ {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host localhost:8443;
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 90s;
    client_max_body_size 10m;
  }

  # Realtime notices (Socket.IO on the notifications service)
  location /ws/ {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host localhost:8443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $lodestar_connection;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
