# Serves the static Expo web export under /field/ (app.json experiments.baseUrl). Every screen is
# pre-rendered at /field/s/<key>.html. The gateway routes https://localhost:8443/field/ here, so the field
# app shares one origin with the desk website, the OData API (/odata/), realtime (/ws/) and Keycloak (/auth/):
# no CORS, and the gateway's TLS and headers apply. This container publishes no host port.
server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = / {
    return 302 /field/;
  }
  location /field/ {
    try_files $uri $uri.html $uri/index.html /field/index.html;
  }
  location /field/_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
