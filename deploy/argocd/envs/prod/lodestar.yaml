# Child application for prod: no automated sync. A release manager reviews
# the diff in Argo CD and syncs inside the project's sync window.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lodestar-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: lodestar
    lodestar.io/environment: prod
spec:
  project: lodestar-prod
  source:
    repoURL: REPO_URL   # set in deploy/argocd/repo (one place)
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: lodestar
  revisionHistoryLimit: 20
  syncPolicy:
    # no `automated:` block => manual sync only
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
    managedNamespaceMetadata:
      labels:
        istio.io/rev: asm-1-26
        pod-security.kubernetes.io/enforce: baseline
    retry:
      limit: 3
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
