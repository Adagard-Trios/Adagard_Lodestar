# The demo application: deploy/k8s/overlays/demo on main, automated sync with prune and self-heal.
# CircleCI's gitops-bump job commits the new image tags to that overlay ([skip ci]); Argo CD polls the repo
# (every 3 minutes by default), runs the migrate Job as a Sync hook, then rolls the services.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lodestar-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: lodestar
    lodestar.io/environment: demo
spec:
  project: lodestar-demo
  source:
    repoURL: REPO_URL   # set in deploy/argocd/repo (one place)
    targetRevision: main
    path: deploy/k8s/overlays/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: lodestar
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
