# App-of-apps root, as installed by Terraform (infra/terraform/modules/argocd,
# helm chart argocd-apps). Kept here for a manual bootstrap or disaster
# recovery:
#   kubectl apply -k deploy/argocd/bootstrap      (dev; the repo URL comes from deploy/argocd/repo)
# For prod, change `dev` to `prod` in the Application name and path.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lodestar-bootstrap
  namespace: argocd
spec:
  description: Bootstrap - root app-of-apps only
  sourceRepos:
    - REPO_URL   # set in deploy/argocd/repo (one place)
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lodestar-root-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lodestar-bootstrap
  source:
    repoURL: REPO_URL   # set in deploy/argocd/repo (one place)
    targetRevision: main
    path: deploy/argocd/envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
