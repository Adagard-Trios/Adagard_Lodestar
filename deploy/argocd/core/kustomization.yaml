# Argo CD "core" for the 4 GiB demo VM (deploy/argocd/README.md, "Demo on k3s", step 3):
#   kubectl create namespace argocd
#   kubectl apply -k deploy/argocd/core --server-side --force-conflicts
# core-install.yaml is Argo CD without the API/UI server, Dex and notifications: the application controller,
# the repo server and Redis only. Use `argocd login --core` or kubectl to look at it (the README says how).
# The patches cap memory so Argo CD stays under ~350 MiB in practice (hard ceiling: the limits, 416 MiB):
#   application-controller 192 Mi · repo-server 176 Mi · redis 48 Mi · applicationset-controller scaled to 0
# and turn down its parallelism (one app, one repo). They also set the kustomize build option overlays/demo needs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/core-install.yaml

patches:
# overlays/demo (through overlays/local) reads the realm and the Postgres init script from outside its folder
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cm
    data:
      kustomize.buildOptions: --load-restrictor LoadRestrictionsNone
      timeout.reconciliation: 180s
# one Application on one node: few workers
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cmd-params-cm
    data:
      controller.status.processors: '4'
      controller.operation.processors: '2'
      controller.kubectl.parallelism.limit: '4'
      reposerver.parallelism.limit: '1'
- patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: argocd-application-controller
    spec:
      template:
        spec:
          containers:
          - name: argocd-application-controller
            env:
            - name: GOMEMLIMIT          # the Go GC works to stay under this, well before the limit
              value: 150MiB
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 500m, memory: 192Mi }
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-repo-server
    spec:
      template:
        spec:
          containers:
          - name: argocd-repo-server
            env:
            - name: GOMEMLIMIT
              value: 128MiB
            resources:
              requests: { cpu: 25m, memory: 96Mi }
              limits: { cpu: 500m, memory: 176Mi }
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-redis
    spec:
      template:
        spec:
          containers:
          - name: redis
            resources:
              requests: { cpu: 10m, memory: 24Mi }
              limits: { cpu: 200m, memory: 48Mi }
# no ApplicationSets here: one Application, applied by hand
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-applicationset-controller
    spec:
      replicas: 0
