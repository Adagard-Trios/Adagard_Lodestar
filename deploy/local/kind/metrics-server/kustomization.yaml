# metrics-server for the kind cluster (the HPAs' CPU/memory source; on AKS it
# is built in). kind's kubelets serve self-signed certificates, hence
# --kubelet-insecure-tls. Applied by up.sh with:
#   kubectl apply -k deploy/local/kind/metrics-server
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
patches:
- target:
    kind: Deployment
    name: metrics-server
    namespace: kube-system
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --kubelet-insecure-tls
