# In-cluster PostgreSQL 16 for kind (Azure: Flexible Server). One database
# `lodestar` (schema per service) plus `keycloak`, created on first start by
# deploy/local/postgres/01-keycloak.sh, exactly as in docker-compose.yml.
# max_connections is raised because every replica the HPAs add opens its own
# Prisma pool (the local DATABASE_URLs cap each pool at connection_limit=5).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      priorityClassName: lodestar-api
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      nodeSelector:
        lodestar.io/pool: apps
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - -c
        - max_connections=300
        - -c
        - shared_buffers=128MB
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: lodestar
        - name: POSTGRES_USER
          value: lodestar
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: KEYCLOAK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: KEYCLOAK_DB_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        # first start runs initdb + init scripts; on a small laptop that can take minutes, and a
        # liveness kill midway leaves a half-initialised data dir that Postgres then won't re-init
        startupProbe:
          exec:
            command: [pg_isready, -U, lodestar, -d, lodestar]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command: [pg_isready, -U, lodestar, -d, lodestar]
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: [pg_isready, -U, lodestar, -d, lodestar]
          periodSeconds: 15
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: init
        configMap:
          name: postgres-init
          defaultMode: 0555
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 2Gi
