# The compose NGINX edge gateway (backend/apps/gateway, image lodestar-gateway)
# as the kind cluster's entry point; on AKS the Istio ingress gateway does this.
#
# Its nginx.conf is written for Docker: `resolver 127.0.0.11` (Docker DNS) and
# short upstream names (auth:3001), which nginx's own resolver cannot expand
# with the pod's DNS search path. The init container copies /etc/nginx and
# rewrites only those, plus the per-IP limits, so one k6 process on the host
# (one client IP) can push enough load through to make the HPAs react:
#   resolver 127.0.0.11       -> kube-dns.kube-system.svc.cluster.local
#   <svc>:<port>              -> <svc>.lodestar.svc.cluster.local:<port>
#   zone=api ... rate=20r/s   -> rate=$LOCAL_API_RATE
#   limit_conn perip 50       -> $LOCAL_CONN_LIMIT
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - name: https
    port: 8443
    targetPort: https
    nodePort: 30443
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/name: gateway
    spec:
      priorityClassName: lodestar-api
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        lodestar.io/pool: apps
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: gateway
        matchLabelKeys:
        - pod-template-hash
      initContainers:
      - name: k8s-config
        image: lodestar/gateway:0.0.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          cp -R /etc/nginx/. /work/
          sed -i -E \
            -e 's/resolver 127\.0\.0\.11/resolver kube-dns.kube-system.svc.cluster.local/' \
            -e 's/([[:space:]])(auth|orders|planning|fleet|outlets|trips|sync|notifications|audit|frontend|identity):([0-9]+)/\1\2.lodestar.svc.cluster.local:\3/g' \
            -e "/zone=api:/s|rate=[0-9]+r/s|rate=${LOCAL_API_RATE}|" \
            -e "s/limit_conn perip [0-9]+;/limit_conn perip ${LOCAL_CONN_LIMIT};/" \
            /work/nginx.conf /work/conf.d/identity-proxy.conf
          grep -n 'resolver \|zone=api\|limit_conn perip\|lodestar.svc' /work/nginx.conf /work/conf.d/identity-proxy.conf
        env:
        - name: LOCAL_API_RATE
          value: 2000r/s
        - name: LOCAL_CONN_LIMIT
          value: '1000'
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: nginx-conf
          mountPath: /work
      containers:
      - name: gateway
        image: lodestar/gateway:0.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: https
          containerPort: 8443
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 15
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
      volumes:
      - name: nginx-conf
        emptyDir:
          sizeLimit: 16Mi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: cache
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: ContainerResource
    containerResource:
      name: cpu
      container: gateway
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: gateway
