# Local migrate + seed, as the compose `migrate` service: prisma migrate
# deploy, then the seed (the competition CSVs are not mounted on kind, so the
# synthetic demo set). up.sh waits for it before waiting on the services.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app: migrate
    app.kubernetes.io/part-of: lodestar
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      priorityClassName: lodestar-batch
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        lodestar.io/pool: apps
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        command: [/bin/sh, -c, 'until pg_isready -h postgres -p 5432 -U lodestar; do sleep 2; done']
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
      containers:
      - name: migrate
        image: lodestar/migrate:0.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        - name: DATA_DIR
          value: /data
        - name: SKIP_SEED
          value: 'false'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
---
# Field app in the browser: http://localhost:8082 (host port 8082 -> 30082).
apiVersion: v1
kind: Service
metadata:
  name: mobile-web-nodeport
  labels:
    app: mobile-web
spec:
  type: NodePort
  selector:
    app: mobile-web
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30082
