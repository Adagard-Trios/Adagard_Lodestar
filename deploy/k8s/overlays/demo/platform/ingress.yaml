# The public edge on k3s: ingress-nginx (hostNetwork, ports 80/443 of the VM) terminates TLS with a
# Let's Encrypt certificate from cert-manager, then hands everything to the gateway, which routes
# /, /field/, /odata/v4/, /auth/ and /ws/ exactly as behind Caddy in the compose demo.
# The gateway's own certificate is self-signed and only seen inside the cluster (backend-protocol HTTPS,
# not verified). The host comes from host.env (replacements in kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lodestar
  labels:
    app: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    # Socket.IO (/ws/) keeps its connection open
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    # Keycloak sends large Set-Cookie / Location headers
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - PUBLIC_HOST
    secretName: lodestar-tls
  rules:
  - host: PUBLIC_HOST
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              name: https
