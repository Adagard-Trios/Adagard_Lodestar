# Who may call whom (caller -> callee edges). Mirrors the app roles granted to
# each workload identity in infra/terraform/modules/platform (api_roles).
#   ingress gateway  -> every exposed service (JWT required on /odata/v4/*)
#   planning         -> agent, orders, fleet, outlets, trips, auth, notifications
#   agent            -> orders, fleet, outlets (read), audit
#   trips            -> auth, orders, fleet, outlets, notifications
#   sync             -> trips, orders, auth, notifications
#   everything       -> audit
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-auth
  namespace: lodestar
  labels:
    app: auth
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: lodestar
spec:
  selector:
    matchLabels:
      app: auth
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/aks-istio-ingress/sa/aks-istio-ingressgateway-internal
        requestPrincipals:
        - '*'
    to:
    - operation:
        paths:
        - /odata/v4/*
  - from:
    - source:
        principals:
        - cluster.local/ns/lodestar/sa/planning
        - cluster.local/ns/lodestar/sa/trips
        - cluster.local/ns/lodestar/sa/sync
        - cluster.local/ns/lodestar/sa/notifications
        requestPrincipals:
        - '*'
    to:
    - operation:
        notPaths:
        - /health
        - /ready
---
