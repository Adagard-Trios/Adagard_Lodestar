# agent: stateless, scaled by KEDA (scaledobject.yaml); see docs/architecture/PLATFORM.md section 9.
# Graceful drain: readiness drops on SIGTERM, but endpoints/Envoy need a few
# seconds to stop sending traffic, so preStop sleeps first; the grace period
# covers that sleep plus in-flight requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app: agent
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: lodestar
spec:
  # Initial size only: the ScaledObject owns spec.replicas (Argo CD ignores it).
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agent
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: lodestar
        version: v1
        azure.workload.identity/use: 'true'
        lodestar.io/db: 'true'
      annotations:
        kubectl.kubernetes.io/default-container: agent
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true, "terminationDrainDuration": "20s"}'
    spec:
      serviceAccountName: agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: lodestar-agent
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # apps pool, or the optional Azure spot pool (agent runs are checkpointed in
      # Postgres, so an evicted pod only delays a run). Prefer spot when it exists.
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: lodestar.io/pool
                operator: In
                values:
                - apps
                - agent-spot
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: agent
      # Zones first (hard: survive a zone loss), then nodes (soft). matchLabelKeys
      # spreads each rollout revision on its own instead of counting old pods.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: agent
        matchLabelKeys:
        - pod-template-hash
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: agent
        matchLabelKeys:
        - pod-template-hash
      containers:
      - name: agent
        image: lodestar/agent:0.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: lodestar-common
        - configMapRef:
            name: agent-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: DATABASE_URL
        # Requests = steady-state usage, so HPA utilisation targets mean something.
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1500m'
            memory: 1Gi
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: agent
