# One voluntary disruption at a time (node drain, cluster-autoscaler scale-in,
# node-image upgrade). Every environment runs >= 2 pods except dev (1), where
# this still lets a node drain. Unhealthy pods never block an eviction.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders
  labels:
    app: orders
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: lodestar
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: orders
