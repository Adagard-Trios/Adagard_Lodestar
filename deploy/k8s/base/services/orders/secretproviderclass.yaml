# Pulls this service's secrets from Key Vault with its workload identity
# (per-secret 'Key Vault Secrets User' RBAC; see infra/terraform/modules/identity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orders
  labels:
    app: orders
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: lodestar
spec:
  provider: azure
  secretObjects:
  - secretName: orders-secrets
    type: Opaque
    labels:
      app: orders
      app.kubernetes.io/name: orders
      app.kubernetes.io/part-of: lodestar
    data:
    - objectName: database-url-orders
      key: DATABASE_URL
  parameters:
    usePodIdentity: 'false'
    clientID: CLIENT_ID_ORDERS
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: database-url-orders
          objectType: secret
