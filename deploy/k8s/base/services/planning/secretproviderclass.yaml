# Pulls this service's secrets from Key Vault with its workload identity
# (per-secret 'Key Vault Secrets User' RBAC; see infra/terraform/modules/identity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: planning
  labels:
    app: planning
    app.kubernetes.io/name: planning
    app.kubernetes.io/part-of: lodestar
spec:
  provider: azure
  secretObjects:
  - secretName: planning-secrets
    type: Opaque
    labels:
      app: planning
      app.kubernetes.io/name: planning
      app.kubernetes.io/part-of: lodestar
    data:
    - objectName: database-url-planning
      key: DATABASE_URL
  parameters:
    usePodIdentity: 'false'
    clientID: CLIENT_ID_PLANNING
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: database-url-planning
          objectType: secret
