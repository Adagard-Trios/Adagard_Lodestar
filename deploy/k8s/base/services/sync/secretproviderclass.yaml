# Pulls this service's secrets from Key Vault with its workload identity
# (per-secret 'Key Vault Secrets User' RBAC; see infra/terraform/modules/identity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sync
  labels:
    app: sync
    app.kubernetes.io/name: sync
    app.kubernetes.io/part-of: lodestar
spec:
  provider: azure
  secretObjects:
  - secretName: sync-secrets
    type: Opaque
    labels:
      app: sync
      app.kubernetes.io/name: sync
      app.kubernetes.io/part-of: lodestar
    data:
    - objectName: database-url-sync
      key: DATABASE_URL
  parameters:
    usePodIdentity: 'false'
    clientID: CLIENT_ID_SYNC
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: database-url-sync
          objectType: secret
