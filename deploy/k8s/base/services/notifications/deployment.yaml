# notifications: stateless, scaled by the HPA (hpa.yaml); see docs/architecture/PLATFORM.md section 9.
# Graceful drain: readiness drops on SIGTERM, but endpoints/Envoy need a few
# seconds to stop sending traffic, so preStop sleeps first; the grace period
# covers that sleep plus in-flight requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app: notifications
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: lodestar
spec:
  # Initial size only: the HPA owns spec.replicas (Argo CD ignores it).
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: notifications
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notifications
        app.kubernetes.io/name: notifications
        app.kubernetes.io/part-of: lodestar
        version: v1
        azure.workload.identity/use: 'true'
        lodestar.io/db: 'true'
        lodestar.io/exposed: 'true'
      annotations:
        kubectl.kubernetes.io/default-container: notifications
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true, "terminationDrainDuration": "20s"}'
    spec:
      serviceAccountName: notifications
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: lodestar-api
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        lodestar.io/pool: apps
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: notifications
      # Zones first (hard: survive a zone loss), then nodes (soft). matchLabelKeys
      # spreads each rollout revision on its own instead of counting old pods.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: notifications
        matchLabelKeys:
        - pod-template-hash
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: notifications
        matchLabelKeys:
        - pod-template-hash
      containers:
      - name: notifications
        image: lodestar/notifications:0.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3008
          protocol: TCP
        envFrom:
        - configMapRef:
            name: lodestar-common
        - configMapRef:
            name: notifications-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: notifications-secrets
              key: DATABASE_URL
        # Socket.IO Redis adapter (fan-out across replicas); see PLATFORM.md section 9
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: notifications-secrets
              key: REDIS_URL
              optional: true
        - name: NODE_OPTIONS
          value: --max-old-space-size=384
        # Requests = steady-state usage, so HPA utilisation targets mean something.
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: notifications
