# Pulls this service's secrets from Key Vault with its workload identity
# (per-secret 'Key Vault Secrets User' RBAC; see infra/terraform/modules/identity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notifications
  labels:
    app: notifications
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: lodestar
spec:
  provider: azure
  secretObjects:
  - secretName: notifications-secrets
    type: Opaque
    labels:
      app: notifications
      app.kubernetes.io/name: notifications
      app.kubernetes.io/part-of: lodestar
    data:
    - objectName: database-url-notifications
      key: DATABASE_URL
    # REDIS_URL: Socket.IO Redis adapter (Azure Cache for Redis, infra/terraform/modules/redis)
    - objectName: redis-url
      key: REDIS_URL
  parameters:
    usePodIdentity: 'false'
    clientID: CLIENT_ID_NOTIFICATIONS
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: database-url-notifications
          objectType: secret
        - |
          objectName: redis-url
          objectType: secret
