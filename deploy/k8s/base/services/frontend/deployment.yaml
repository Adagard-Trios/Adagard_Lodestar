# frontend: stateless, scaled by the HPA (hpa.yaml); see docs/architecture/PLATFORM.md section 9.
# Graceful drain: readiness drops on SIGTERM, but endpoints/Envoy need a few
# seconds to stop sending traffic, so preStop sleeps first; the grace period
# covers that sleep plus in-flight requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: lodestar
spec:
  # Initial size only: the HPA owns spec.replicas (Argo CD ignores it).
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: lodestar
        version: v1
        lodestar.io/exposed: 'true'
      annotations:
        kubectl.kubernetes.io/default-container: frontend
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true, "terminationDrainDuration": "20s"}'
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: lodestar-api
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        lodestar.io/pool: apps
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: frontend
      # Zones first (hard: survive a zone loss), then nodes (soft). matchLabelKeys
      # spreads each rollout revision on its own instead of counting old pods.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: frontend
        matchLabelKeys:
        - pod-template-hash
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: frontend
        matchLabelKeys:
        - pod-template-hash
      containers:
      - name: frontend
        image: lodestar/frontend:0.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: frontend-config
        # Requests = steady-state usage, so HPA utilisation targets mean something.
        resources:
          requests:
            cpu: 200m
            memory: 320Mi
          limits:
            cpu: '1'
            memory: 640Mi
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: next-cache
          mountPath: /app/.next/cache
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: next-cache
        emptyDir:
          sizeLimit: 256Mi
