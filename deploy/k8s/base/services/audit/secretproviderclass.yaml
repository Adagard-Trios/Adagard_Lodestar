# Pulls this service's secrets from Key Vault with its workload identity
# (per-secret 'Key Vault Secrets User' RBAC; see infra/terraform/modules/identity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: audit
  labels:
    app: audit
    app.kubernetes.io/name: audit
    app.kubernetes.io/part-of: lodestar
spec:
  provider: azure
  secretObjects:
  - secretName: audit-secrets
    type: Opaque
    labels:
      app: audit
      app.kubernetes.io/name: audit
      app.kubernetes.io/part-of: lodestar
    data:
    - objectName: database-url-audit
      key: DATABASE_URL
  parameters:
    usePodIdentity: 'false'
    clientID: CLIENT_ID_AUDIT
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: database-url-audit
          objectType: secret
