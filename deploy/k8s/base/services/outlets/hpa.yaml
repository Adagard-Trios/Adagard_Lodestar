apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: outlets
  labels:
    app: outlets
    app.kubernetes.io/name: outlets
    app.kubernetes.io/part-of: lodestar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: outlets
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
