#cloud-config
# Rendered by Terraform (templatefile). Docker (engine + compose plugin) and a 4 GiB swap file. k3s only when
# install_k3s = true, and then with its ingress NOT bound to 80/443 (Caddy in the compose stack owns 80/443 until
# the GitOps cut-over: deploy/azure-demo/README.md).
package_update: true
packages: [ca-certificates, curl, git, jq]

write_files:
  - path: /etc/sysctl.d/90-lodestar.conf
    content: |
      vm.swappiness = 10
      vm.max_map_count = 262144
  # container logs rotate instead of filling the small disk
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "local", "log-opts": { "max-size": "10m", "max-file": "3" } }

runcmd:
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl --system
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ${admin_username} || true
  - systemctl enable --now docker
  # unused images and build cache are cleared every week
  - echo '0 4 * * 0 root docker system prune -af --filter "until=168h" >/dev/null 2>&1' > /etc/cron.d/docker-prune
%{ if install_k3s ~}
  # k3s without Traefik and without its service load balancer, so nothing in k3s listens on 80/443 yet
  - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable=traefik --disable=servicelb --write-kubeconfig-mode=600" sh -
%{ endif ~}
  - mkdir -p /opt/lodestar && chown ${admin_username}:${admin_username} /opt/lodestar
